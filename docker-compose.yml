# Local development services only. Synthetic data only; never load real patient data here.
# Medplum (the FHIR clinical store) is added in Sprint 3 once its configuration has been tested.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: medico
      POSTGRES_PASSWORD: medico
      POSTGRES_DB: medico
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medico"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
